trigger: none
pr: none
schedules:
  - cron: "0 */1 * * *"
    displayName: Mend SCA Sync Scheduler
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
- group: main
- group: content

steps:

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Mend Azure Work Item Sync'

- script: python mend_azure_wi_sync/azure_wi_sync.py
  displayName: 'Mend SCA Work Item Sync'
  env:
    # Required parameters
    # Documentation: https://github.com/mend-toolkit/azure-wi-sync/tree/main#azure-pipeline-variables
    MEND_URL: $(MEND_URL)
    MEND_USERKEY: $(MEND_USERKEY)
    MEND_APIKEY: $(MEND_APIKEY)
    MEND_AZUREPAT: $(MEND_AZUREPAT)
    MEND_AZUREURI: $(System.CollectionUri)
    MEND_AZUREPROJECT: $(System.TeamProject)
    # Optional parameters
    MEND_PRODUCTTOKEN: $(MEND_PRODUCTTOKEN)
    MEND_PROJECTTOKEN: $(MEND_PROJECTTOKEN)
    MEND_EXCLUDETOKEN: $(MEND_EXCLUDETOKEN)
    MEND_AZUREAREA: $(MEND_AZUREAREA)
    MEND_AZURETYPE: $(MEND_AZURETYPE)
    MEND_RESET: $(MEND_RESET)
    MEND_CUSTOMFIELDS: $(MEND_CUSTOMFIELDS)
    MEND_DEPENDENCY : $(MEND_DEPENDENCY)
    MEND_REPONAME : $(MEND_REPONAME)
    MEND_DESCRIPTION : $(MEND_DESCRIPTION)
    MEND_CALCULATEPRIORITY : $(MEND_CALCULATEPRIORITY)
    MEND_ALERT : $(MEND_ALERT)
    MEND_MAXLOOKBACK: $(MEND_MAXLOOKBACK)
    # Tag-based routing to multiple Azure projects (optional — requires Mend API 2.0)
    # MEND_ROUTING: $(MEND_ROUTING)
    # MEND_BRANCHES: $(MEND_BRANCHES)
    # Reachability, EPSS and exploitability on every work item (optional — Mend API 3.0)
    # MEND_ENRICHMENT: $(MEND_ENRICHMENT)
    # Required by MEND_ROUTING and MEND_ENRICHMENT alike — both authenticate to Mend
    # API 2.0/3.0, which has no default email.
    # MEND_EMAIL: $(MEND_EMAIL)
    # NOTE: uncomment a line only once the matching pipeline variable exists. Azure leaves
    # an undefined variable as the literal string "$(MEND_ENRICHMENT)", which normalizes to
    # "false" — the feature then stays off with nothing logged as an error.
