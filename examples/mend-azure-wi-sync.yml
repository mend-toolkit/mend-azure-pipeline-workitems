trigger: none
pr: none
schedules:
  - cron: "0 */1 * * *"
    displayName: Mend SCA Sync Scheduler
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
- group: main
- group: content

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Use Python 3.12'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Mend Azure Work Item Sync'

- script: python mend_azure_wi_sync/azure_wi_sync.py
  displayName: 'Mend SCA Work Item Sync'
  env:
    # Required parameters
    # Documentation: https://github.com/mend-toolkit/azure-wi-sync/tree/main#azure-pipeline-variables
    MEND_URL: $(MEND_URL)
    MEND_USERKEY: $(MEND_USERKEY)
    MEND_APIKEY: $(MEND_APIKEY)
    MEND_AZUREPAT: $(MEND_AZUREPAT)
    MEND_AZUREURI: $(System.CollectionUri)
    MEND_AZUREPROJECT: $(System.TeamProject)
    # Optional parameters
    MEND_PRODUCTTOKEN: $(MEND_PRODUCTTOKEN)
    MEND_PROJECTTOKEN: $(MEND_PROJECTTOKEN)
    MEND_EXCLUDETOKEN: $(MEND_EXCLUDETOKEN)
    MEND_AZUREAREA: $(MEND_AZUREAREA)
    MEND_AZURETYPE: $(MEND_AZURETYPE)
    MEND_CUSTOMFIELDS: $(MEND_CUSTOMFIELDS)
    MEND_DEPENDENCY : $(MEND_DEPENDENCY)
    MEND_REPONAME : $(MEND_REPONAME)
    MEND_DESCRIPTION : $(MEND_DESCRIPTION)
    MEND_CALCULATEPRIORITY : $(MEND_CALCULATEPRIORITY)
    # Tag-based routing to multiple Azure projects (optional)
    # MEND_ROUTING: $(MEND_ROUTING)
    # MEND_BRANCHES: $(MEND_BRANCHES)
    # EPSS score and exploit code maturity always render and have no variable.
    # Reachability on every work item (optional) — an org without reachability analysis
    # enabled can leave this off and avoid a column of "-"
    # MEND_REACHABILITY: $(MEND_REACHABILITY)
    # Read from the same Mend 3.0 finding as the rest of the work item — no extra call, no
    # extra variable and no extra Mend permission.
    # NOTE: uncomment the line only once the matching pipeline variable exists. Azure leaves
    # an undefined variable as the literal string "$(MEND_REACHABILITY)", which normalizes to
    # "false" — the feature then stays off with nothing logged as an error.
    # Mend API 3.0 credentials — inert until a feature that uses 3.0 is enabled.
    # MEND_EMAIL: $(MEND_EMAIL)
    # MEND_ORGUUID defaults to MEND_APIKEY; set it only if they differ for your org.
    # MEND_ORGUUID: $(MEND_ORGUUID)
